name: Build Potato Runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with Gradle
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon

      - name: Show artifact SHA-256
        shell: pwsh
        run: Get-ChildItem build\libs\*.jar | Get-FileHash -Algorithm SHA256 | Format-Table Path, Hash -AutoSize

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: potato-runtime-build
          path: build/libs/*.jar
          if-no-files-found: error
